<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype A — Tabel + Drawer Samping</title>
<style>

*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font:14px/1.45 system-ui,Segoe UI,sans-serif;color:var(--ink)}
.tl{padding:20px 24px;max-width:1280px;margin:0 auto}

.edited{font-size:11px;color:var(--acc);background:var(--acc-soft);border-radius:4px;padding:1px 6px;margin-left:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{color:#fff;filter:brightness(1.1)}.btn.sm{padding:3px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;color:var(--muted)}

.scrim{z-index:55;position:fixed;inset:0;background:rgba(23,33,43,.35);opacity:0;pointer-events:none;transition:.2s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:50%;top:50%;width:760px;max-width:94vw;max-height:88vh;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:.18s;display:flex;flex-direction:column;overflow:hidden;z-index:60}
.drawer.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.db{padding:16px 20px;overflow:auto;flex:1}.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--soft)}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:0 0 16px}dt{color:var(--muted)}dd{margin:0}
.mode{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--acc);background:var(--acc-soft);padding:2px 10px;border-radius:999px}
.line input{width:100%}.line input.q{width:80px;text-align:right}.diff{font-size:12px;color:var(--faint)}.diff b{color:var(--ink)}
.dirty td{background:#fffbea}.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 12px;margin:12px 0;font-size:13px}
.impact{background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:13px}
.hist{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}.hist li{margin:4px 0;font-size:13px}
label.f{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}.req{color:var(--bad)}
.toast{z-index:90;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:8px;display:none}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}.tabs button{border:0;background:none;padding:8px 18px 10px;font:inherit;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;text-align:left}.tabs button b{display:block;font-size:15px;color:var(--ink)}.tabs button small{font-size:12px}.tabs button[aria-pressed=true]{border-bottom-color:var(--acc);color:var(--acc)}.tabs button[aria-pressed=true] b{color:var(--acc)}.tabs .cnt{background:var(--soft);border-radius:999px;padding:0 8px;font-size:12px;margin-left:4px;color:var(--muted)}
.drp{position:relative}.drp-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;min-width:230px}
.drp-btn svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.7}.drp-btn:hover,.drp-btn.on{border-color:#0f6b5a}
.drp-pop{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.16);width:600px;max-width:94vw}
.drp-pop.on{display:flex}.drp-pre{width:178px;padding:12px;border-right:1px solid var(--line);flex:none}
.drp-pre button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;margin-bottom:2px}
.drp-pre button:hover{background:var(--soft)}.drp-pre button.on{background:#dcede8;color:#0f5a4b;font-weight:600}
.drp-cal{flex:1;padding:16px 18px;min-width:0}.drp-in{display:flex;align-items:center;gap:8px;margin-bottom:14px}.drp-in>span{color:var(--faint)}
.drp-f{flex:1;border:2px solid var(--line);border-radius:10px;padding:5px 12px;background:#fff;text-align:left;font:inherit;cursor:pointer}.drp-f small{display:block;font-size:11.5px;color:var(--muted)}.drp-f b{font-size:14px}.drp-f.on{border-color:#0f6b5a}
.drp-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.drp-nav button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);padding:2px 10px}
.drp-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}.drp-g .h{font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 0}
.drp-g button{border:0;background:none;height:38px;font:inherit;font-weight:500;cursor:pointer;color:#0f4f43}.drp-g button.mid{background:#dcede8}
.drp-g button.s,.drp-g button.e{background:#0f6b5a;color:#fff;font-weight:700}.drp-g button.s{border-radius:19px 0 0 19px}.drp-g button.e{border-radius:0 19px 19px 0}.drp-g button.s.e{border-radius:19px}
.drp-g button.dis{color:#b9c2cb;cursor:not-allowed}.drp-g .k{height:38px}.drp-hint{font-size:12.5px;color:var(--muted);margin-top:10px}
@media(max-width:640px){.drp-pop{flex-direction:column;width:94vw}.drp-pre{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.drp-pre button{width:auto}}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);padding:0 6px}.tabs button{border:0;background:none;padding:12px 2px 13px;font:inherit;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}.tabs button b{display:inline;font-size:inherit;font-weight:400;color:var(--muted);margin-left:4px}.tabs button:hover{color:var(--ink)}.tabs button[aria-pressed=true]{color:var(--ink);font-weight:700;border-bottom-color:#0f6b5a}.tabs button[aria-pressed=true] b{color:#0f6b5a;font-weight:700}.tabs .pcs{font-weight:400;font-size:13px;margin-left:6px;color:var(--faint)}.tabs button[aria-pressed=true] .pcs{color:#0f6b5a;font-weight:600}
.msel{position:relative}.msel>small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}.msel-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:190px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font:inherit;color:var(--muted);cursor:pointer}.msel-btn.has{color:var(--ink);font-weight:600}.msel-btn:hover,.msel-btn.on{border-color:#0f6b5a}
.msel-pop{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.16);width:280px;padding:8px 0 0}.msel-pop.on{display:block}
.msel-o{display:flex;align-items:center;gap:14px;padding:10px 18px;cursor:pointer}.msel-o:hover{background:var(--soft)}.msel-o input{width:20px;height:20px;accent-color:#0f6b5a;margin:0;cursor:pointer}.msel-o span{flex:1;font-weight:500}.msel-o em{font-style:normal;color:var(--faint)}
.msel-f{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 12px 18px;border-top:1px solid var(--line);margin-top:6px}.msel-f .r{border:0;background:none;color:#0f6b5a;font:inherit;font-weight:700;cursor:pointer}.msel-f .d{border:0;background:#0f6b5a;color:#fff;border-radius:10px;padding:9px 20px;font:inherit;font-weight:700;cursor:pointer}
.fl{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:14px 0 14px}.fld small,.msel>small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}.fld.grow{flex:1;min-width:240px}.fld.grow input{width:100%}
.drp-btn,.msel-btn,.fld input[type=search]{height:40px;box-sizing:border-box}.fld input[type=search]{padding:0 14px;border-radius:10px;font-size:14px}.drp-btn{min-width:210px}.msel-btn{min-width:200px}
.nowrap{white-space:nowrap}td.act,th.act{text-align:right;white-space:nowrap}
tr.go.in td{background:#eef8f1}tr.go.out td{background:#fdf0ee}tr.go.in:hover td{background:#e1f3e8}tr.go.out:hover td{background:#fae2de}tr.go td{border-top-color:#fff}
tr.go.in td:first-child{box-shadow:inset 4px 0 0 #2e9e63}tr.go.out td:first-child{box-shadow:inset 4px 0 0 #d9534f}
.cp{border:0;background:none;color:var(--muted);cursor:pointer;padding:3px 5px;margin-left:4px;border-radius:6px;vertical-align:middle}.cp:hover{background:rgba(0,0,0,.07);color:var(--ink)}.cp.ok{color:var(--ok)}
</style></head><body>
<div class="proto"><b>PROTOTYPE A</b> — Tabel + Drawer samping · klik baris untuk melihat detail · tombol <b>Edit</b> mengubah drawer jadi form (data dummy)</div>
<div class="tl">
  <div class="tb">
  <div class="chips" id="chips"></div>
  <div class="fl"><div class="msel" id="msel"></div><div class="fld"><small>Tanggal</small><div class="drp" id="drp"></div></div><input type="hidden" id="dari"><input type="hidden" id="sampai"><div class="fld grow"><small>Pencarian</small><input type="search" id="q" placeholder="Cari nomor, petugas, atau SKU"></div></div>
 </div>
 <div class="panel"><table><thead><tr><th>No. transfer</th><th>Petugas list</th><th>Petugas input</th><th class="n">Qty</th><th class="act">Aksi</th></tr></thead><tbody id="tb"></tbody></table></div>
 <div class="pager"><span id="info"></span><span>Baris per halaman <select><option>50</option></select></span></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Detail transfer"></aside>
<div class="toast" id="toast"></div>
<script>
var DATA=[
 {id:1,nomor:'TTL-2026-00142',arah:'MASUK',sumber:'Input',ref:'',list:'Rina 14',tglList:'2026-10-24 09:12:03',input:'Dewi 07',tglInput:'2026-10-24 10:01:44',dibuat:'2026-10-24 10:01:44',baris:[{sku:'KMJ-HTM-M',rak:'TL-A-03',qty:12,sb:4,ss:16},{sku:'KMJ-HTM-L',rak:'TL-A-03',qty:8,sb:0,ss:8}]},
 {id:2,nomor:'TTL-2026-00141',arah:'KELUAR',sumber:'Request',ref:'RT-0087',list:'Budi 03',tglList:'2026-10-24 08:30:10',input:'Dewi 07',tglInput:'2026-10-24 09:40:21',dibuat:'2026-10-24 09:40:21',baris:[{sku:'CLN-JNS-30',rak:'TL-B-11',qty:5,sb:9,ss:4}]},
 {id:3,nomor:'TTL-2026-00140',arah:'MASUK',sumber:'Upload Excel',ref:'UP-0023',list:'Rina 14',tglList:'2026-10-22 15:02:00',input:'Andi 21',tglInput:'2026-10-22 15:20:09',dibuat:'2026-10-22 15:20:09',baris:[{sku:'TAS-RNS-BK',rak:'TL-C-01',qty:20,sb:2,ss:22},{sku:'TAS-RNS-BR',rak:'TL-C-02',qty:15,sb:0,ss:15},{sku:'DMP-KLS-02',rak:'TL-C-09',qty:6,sb:1,ss:7}]},
 {id:4,nomor:'TTL-2026-00139',arah:'KELUAR',sumber:'Koreksi',ref:'',list:'',input:'Andi 21',tglInput:'2026-10-22 11:05:31',dibuat:'2026-10-22 11:05:31',baris:[{sku:'KMJ-HTM-M',rak:'TL-A-03',qty:2,sb:6,ss:4}]},
 {id:5,nomor:'TTL-2026-00138',arah:'KELUAR',sumber:'Request',ref:'RT-0086',list:'Budi 03',tglList:'2026-10-22 08:11:00',input:null,tglInput:null,dibuat:'2026-10-22 08:11:00',baris:[]}
];
var sumberSel=[],arah='',kw='',sel=null,mode='lihat',draft=null;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tgl(s){var m=/^(\d{4})-(\d\d)-(\d\d) (.*)$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]+' '+m[4]:'—'}
function qty(t){return t.baris.reduce(function(a,b){return a+b.qty},0)}
function tabsHtml(){var r=filt(true);return [['','Semua'],['MASUK','Masuk'],['KELUAR','Keluar']].map(function(t){var x=r.filter(function(y){return !t[0]||y.arah===t[0]});var p=x.reduce(function(a,y){return a+qty(y)},0);return '<button %%s aria-pressed="'+(arah===t[0])+'">'+t[1]+'<b>'+x.length+'</b></button>'}).join('')}
function chips(){$('#chips').className='tabs';$('#chips').innerHTML=tabsHtml()}
function filt(abaiArah,abaiSumber){return DATA.filter(function(t){var d=t.dibuat.slice(0,10);if(($('#dari').value&&d<$('#dari').value)||($('#sampai').value&&d>$('#sampai').value))return false;var s=(t.nomor+t.list+t.input+t.baris.map(function(b){return b.sku}).join(' ')).toLowerCase();return (abaiArah||!arah||t.arah===arah)&&(abaiSumber||!sumberSel.length||sumberSel.indexOf(t.sumber)>-1)&&(!kw||s.indexOf(kw)>-1)})}
var IC_CP='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',IC_OK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"/></svg>';
function salin(teks,btn){
 function ok(){btn.innerHTML=IC_OK;btn.classList.add('ok');toast('Nomor '+teks+' disalin');setTimeout(function(){btn.innerHTML=IC_CP;btn.classList.remove('ok')},1400)}
 function fb(){var a=document.createElement('textarea');a.value=teks;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove();ok()}
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(teks).then(ok,fb)}else fb()}

 $('#tb').innerHTML=r.map(function(t){var q=qty(t);t.arah==='MASUK'?i+=q:o+=q;
  var c2=function(n,w){return '<td class="c2">'+esc(n||'—')+'<small>'+(w?tgl(w):'')+'</small></td>'};
  return '<tr class="go '+(t.arah==='MASUK'?'in':'out')+'" data-id="'+t.id+'"><td class="nowrap"><b class="mono">'+t.nomor+'</b><button type="button" class="cp" data-cp="'+t.nomor+'" title="Salin nomor transfer" aria-label="Salin nomor transfer">'+IC_CP+'</button>'+(t.diedit?'<span class="edited">diedit</span>':'')+'</td>'+c2(t.list,t.tglList)+c2(t.input,t.tglInput)+'<td class="n">'+(t.input?'<b>'+(t.arah==='MASUK'?'+':'−')+q+'</b>':'<span class="muted">menunggu qty</span>')+'</td><td class="act"><button class="btn sm" data-detail="'+t.id+'">Detail</button> <button class="btn sm" data-edit="'+t.id+'">Edit</button></td></tr>'}).join('')||'<tr><td colspan="5" class="muted" style="text-align:center;padding:30px">Tidak ada transfer yang cocok</td></tr>';
 chips();$('#info').textContent='1–'+r.length+' dari '+r.length+' transfer'}
function buka(id,m){sel=id;mode=m||'lihat';var t=DATA.filter(function(x){return x.id===id})[0];draft=JSON.parse(JSON.stringify(t));draft.alasan='';render();$('#drawer').classList.add('on');$('#scrim').classList.add('on');tabel()}
function tutup(){$('#drawer').classList.remove('on');$('#scrim').classList.remove('on');sel=null;tabel()}
function t0(){return DATA.filter(function(x){return x.id===sel})[0]}

 var h='<div class="dh"><div><b class="mono" style="font-size:18px">'+t.nomor+'</b> <span class="pill '+(masuk?'ok':'warn')+'">'+(masuk?'Masuk':'Keluar')+'</span>'+(m?' <span class="mode">Mode edit</span>':'')+'<div class="muted" style="margin-top:2px">'+t.sumber+(t.ref?' · '+t.ref:'')+'</div></div><button class="btn sm" data-x>✕</button></div><div class="db">';
 if(m){h+='<label class="f">Petugas list</label><input id="eList" value="'+esc(ed.list)+'" style="width:100%"><label class="f">Petugas input</label><input id="eInput" value="'+esc(ed.input)+'" style="width:100%">'}
 else h+='<dl><dt>Petugas list</dt><dd>'+esc(t.list||'—')+' <span class="muted">'+(t.tglList?tgl(t.tglList):'')+'</span></dd><dt>Petugas input</dt><dd>'+esc(t.input||'—')+' <span class="muted">'+(t.tglInput?tgl(t.tglInput):'')+'</span></dd><dt>Dibuat</dt><dd class="mono">'+tgl(t.dibuat)+'</dd></dl>';
 h+='<table><thead><tr><th>SKU</th><th>No rak</th><th class="n">Qty</th><th class="n">'+(m?'Stok akhir':'Sebelum → Sesudah')+'</th>'+(m?'<th></th>':'')+'</tr></thead><tbody>';
 if(!ed.baris.length)h+='<tr><td colspan="5" class="muted">Menunggu CS input qty dari slip.</td></tr>';
 ed.baris.forEach(function(b,i){var o=t.baris[i],dirty=m&&o&&(o.qty!==b.qty||o.sku!==b.sku||o.rak!==b.rak);
