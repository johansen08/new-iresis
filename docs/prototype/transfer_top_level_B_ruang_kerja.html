<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype B — Ruang Kerja Dua Panel</title>
<style>
:root{--ink:#17212b;--muted:#5d6a77;--faint:#8793a0;--line:#e2e6eb;--soft:#f0f2f5;--surf:#fff;--acc:#2159c9;--acc-soft:#e6eefc;--ok:#157347;--ok-bg:#e1f3e8;--warn:#8a5700;--warn-bg:#fdf0d2;--bad:#b3261e;--bad-bg:#fbe6e4}
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font:14px/1.45 system-ui,Segoe UI,sans-serif;color:var(--ink)}
.proto{background:#17212b;color:#fff;padding:8px 24px;font-size:12px}.proto b{color:#9ec1ff}
.muted{color:var(--muted)}.mono{font-family:Consolas,monospace}
.top{display:block;padding:12px 24px 0}h1{font-size:20px;margin:0 16px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}.seg button{border:0;background:none;padding:6px 14px;font:inherit;cursor:pointer}.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
.ws{display:grid;grid-template-columns:400px 1fr;gap:16px;padding:0 24px 24px;height:calc(100vh - 215px);min-height:520px}
.list{overflow:auto;background:var(--surf);border:1px solid var(--line);border-radius:12px}
.day{position:sticky;top:0;background:var(--soft);padding:6px 14px;font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;z-index:1}
.card{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:4px solid transparent}.card:hover{background:#f8faff}
.card.sel{background:var(--acc-soft);border-left-color:var(--acc)}.card.in{--c:var(--ok)}.card.out{--c:#d98a00}
.card .r1{display:flex;justify-content:space-between;align-items:center}.card .r2{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:8px}
.qty{font-weight:700;color:var(--c)}
.edited{font-size:11px;color:var(--acc);background:var(--acc-soft);border-radius:4px;padding:1px 6px;margin-left:6px}
.detail{background:var(--surf);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.empty{margin:auto;color:var(--faint);text-align:center}
.dhead{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.dbody{padding:18px 22px;overflow:auto;flex:1}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.meta div{background:var(--soft);border-radius:10px;padding:10px 12px}.meta small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{color:#fff;filter:brightness(1.1)}.btn.sm{padding:3px 10px;font-size:13px}.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--muted);background:var(--soft);padding:8px 10px;font-weight:600}td{padding:8px 10px;border-top:1px solid var(--line)}.n{text-align:right}
/* klik-untuk-edit */
.ed{border-bottom:1px dashed var(--faint);cursor:text;padding:1px 2px;border-radius:3px}.ed:hover{background:var(--acc-soft);border-bottom-color:var(--acc)}
td input{width:100%;padding:3px 7px}td input.q{width:72px;text-align:right}
td.chg{background:#fffbea}.was{display:block;font-size:11.5px;color:var(--faint);text-decoration:line-through}
.save{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#fff7dd;border-top:1px solid #f0d78a}
.save input{flex:1}
.tl-hist{margin:22px 0 0;padding:0;list-style:none;border-left:2px solid var(--line);margin-left:6px}
.tl-hist li{position:relative;padding:0 0 12px 18px;font-size:13px}.tl-hist li:before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--faint)}
.tl-hist li.e:before{border-color:var(--acc);background:var(--acc)}
h3{font-size:14px;margin:0 0 8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:8px;display:none}
@media(max-width:900px){.ws{grid-template-columns:1fr;height:auto}.list{max-height:320px}}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line)}.tabs button{border:0;background:none;padding:8px 18px 10px;font:inherit;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;text-align:left}.tabs button b{display:block;font-size:15px;color:var(--ink)}.tabs button small{font-size:12px}.tabs button[aria-pressed=true]{border-bottom-color:var(--acc);color:var(--acc)}.tabs button[aria-pressed=true] b{color:var(--acc)}.tabs .cnt{background:var(--soft);border-radius:999px;padding:0 8px;font-size:12px;margin-left:4px;color:var(--muted)}
.drp{position:relative}.drp-btn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;min-width:230px}
.drp-btn svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.7}.drp-btn:hover,.drp-btn.on{border-color:#0f6b5a}
.drp-pop{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.16);width:600px;max-width:94vw}
.drp-pop.on{display:flex}.drp-pre{width:178px;padding:12px;border-right:1px solid var(--line);flex:none}
.drp-pre button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;margin-bottom:2px}
.drp-pre button:hover{background:var(--soft)}.drp-pre button.on{background:#dcede8;color:#0f5a4b;font-weight:600}
.drp-cal{flex:1;padding:16px 18px;min-width:0}.drp-in{display:flex;align-items:center;gap:8px;margin-bottom:14px}.drp-in>span{color:var(--faint)}
.drp-f{flex:1;border:2px solid var(--line);border-radius:10px;padding:5px 12px;background:#fff;text-align:left;font:inherit;cursor:pointer}.drp-f small{display:block;font-size:11.5px;color:var(--muted)}.drp-f b{font-size:14px}.drp-f.on{border-color:#0f6b5a}
.drp-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.drp-nav button{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);padding:2px 10px}
.drp-g{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}.drp-g .h{font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 0}
.drp-g button{border:0;background:none;height:38px;font:inherit;font-weight:500;cursor:pointer;color:#0f4f43}.drp-g button.mid{background:#dcede8}
.drp-g button.s,.drp-g button.e{background:#0f6b5a;color:#fff;font-weight:700}.drp-g button.s{border-radius:19px 0 0 19px}.drp-g button.e{border-radius:0 19px 19px 0}.drp-g button.s.e{border-radius:19px}
.drp-g button.dis{color:#b9c2cb;cursor:not-allowed}.drp-g .k{height:38px}.drp-hint{font-size:12.5px;color:var(--muted);margin-top:10px}
@media(max-width:640px){.drp-pop{flex-direction:column;width:94vw}.drp-pre{width:auto;display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.drp-pre button{width:auto}}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);padding:0 6px}.tabs button{border:0;background:none;padding:12px 2px 13px;font:inherit;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}.tabs button b{display:inline;font-size:inherit;font-weight:400;color:var(--muted);margin-left:4px}.tabs button:hover{color:var(--ink)}.tabs button[aria-pressed=true]{color:var(--ink);font-weight:700;border-bottom-color:#0f6b5a}.tabs button[aria-pressed=true] b{color:#0f6b5a;font-weight:700}.tabs .pcs{font-weight:400;font-size:13px;margin-left:6px;color:var(--faint)}.tabs button[aria-pressed=true] .pcs{color:#0f6b5a;font-weight:600}
.msel{position:relative}.msel>small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}.msel-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:190px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;font:inherit;color:var(--muted);cursor:pointer}.msel-btn.has{color:var(--ink);font-weight:600}.msel-btn:hover,.msel-btn.on{border-color:#0f6b5a}
.msel-pop{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.16);width:280px;padding:8px 0 0}.msel-pop.on{display:block}
.msel-o{display:flex;align-items:center;gap:14px;padding:10px 18px;cursor:pointer}.msel-o:hover{background:var(--soft)}.msel-o input{width:20px;height:20px;accent-color:#0f6b5a;margin:0;cursor:pointer}.msel-o span{flex:1;font-weight:500}.msel-o em{font-style:normal;color:var(--faint)}
.msel-f{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 12px 18px;border-top:1px solid var(--line);margin-top:6px}.msel-f .r{border:0;background:none;color:#0f6b5a;font:inherit;font-weight:700;cursor:pointer}.msel-f .d{border:0;background:#0f6b5a;color:#fff;border-radius:10px;padding:9px 20px;font:inherit;font-weight:700;cursor:pointer}
.fl{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:14px 0 14px}.fld small,.msel>small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}.fld.grow{flex:1;min-width:240px}.fld.grow input{width:100%}
.drp-btn,.msel-btn,.fld input[type=search]{height:40px;box-sizing:border-box}.fld input[type=search]{padding:0 14px;border-radius:10px;font-size:14px}.drp-btn{min-width:210px}.msel-btn{min-width:200px}
</style></head><body>
<div class="proto"><b>PROTOTYPE B</b> — Ruang kerja dua panel (daftar kartu per hari + detail) · edit langsung di tempat: klik nilai bergaris putus, atau tombol <b>Edit</b> (data dummy)</div>
<div class="top">
 <div class="tabs" id="seg"></div>
 <div class="fl"><div class="msel" id="msel"></div><div class="fld"><small>Tanggal</small><div class="drp" id="drp"></div></div><input type="hidden" id="dari"><input type="hidden" id="sampai"><div class="fld grow"><small>Pencarian</small><input type="search" id="q" placeholder="Cari nomor, petugas, atau SKU"></div></div>
 </div>
<div class="ws"><div class="list" id="list"></div><section class="detail" id="detail"></section></div>
<div class="toast" id="toast"></div>
<script>
var DATA=[
 {id:1,nomor:'TTL-2026-00142',arah:'MASUK',sumber:'Input',ref:'',list:'Rina 14',tglList:'2026-10-24 09:12:03',input:'Dewi 07',tglInput:'2026-10-24 10:01:44',dibuat:'2026-10-24 10:01:44',baris:[{sku:'KMJ-HTM-M',rak:'TL-A-03',qty:12,sb:4},{sku:'KMJ-HTM-L',rak:'TL-A-03',qty:8,sb:0}],log:[]},
 {id:2,nomor:'TTL-2026-00141',arah:'KELUAR',sumber:'Request',ref:'RT-0087',list:'Budi 03',tglList:'2026-10-24 08:30:10',input:'Dewi 07',tglInput:'2026-10-24 09:40:21',dibuat:'2026-10-24 09:40:21',baris:[{sku:'CLN-JNS-30',rak:'TL-B-11',qty:5,sb:9}],log:[{w:'23/10/2026 11:20:02',o:'Andi 21',t:'Qty CLN-JNS-30: 4 → 5',a:'Salah baca slip'}]},
 {id:3,nomor:'TTL-2026-00140',arah:'MASUK',sumber:'Upload Excel',ref:'UP-0023',list:'Rina 14',tglList:'2026-10-22 15:02:00',input:'Andi 21',tglInput:'2026-10-22 15:20:09',dibuat:'2026-10-22 15:20:09',baris:[{sku:'TAS-RNS-BK',rak:'TL-C-01',qty:20,sb:2},{sku:'TAS-RNS-BR',rak:'TL-C-02',qty:15,sb:0},{sku:'DMP-KLS-02',rak:'TL-C-09',qty:6,sb:1}],log:[]},
 {id:4,nomor:'TTL-2026-00139',arah:'KELUAR',sumber:'Koreksi',ref:'',list:'',tglList:null,input:'Andi 21',tglInput:'2026-10-22 11:05:31',dibuat:'2026-10-22 11:05:31',baris:[{sku:'KMJ-HTM-M',rak:'TL-A-03',qty:2,sb:6}],log:[]},
 {id:5,nomor:'TTL-2026-00138',arah:'KELUAR',sumber:'Request',ref:'RT-0086',list:'Budi 03',tglList:'2026-10-22 08:11:00',input:null,tglInput:null,dibuat:'2026-10-22 08:11:00',baris:[],log:[]}
];
var sumberSel=[],arah='',kw='',sel=null,edit=false,draft=null,alasan='';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tgl(s){var m=/^(\d{4})-(\d\d)-(\d\d) (.*)$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]+' '+m[4]:'—'}
function hari(s){var m=/^(\d{4})-(\d\d)-(\d\d)/.exec(s);return m[3]+'/'+m[2]+'/'+m[1]}
function qty(t){return t.baris.reduce(function(a,b){return a+b.qty},0)}
function cur(){return DATA.filter(function(x){return x.id===sel})[0]}
function seg(){$('#seg').innerHTML=tabsHtml()}
function tabsHtml(){var r=filt(true);return [['','Semua'],['MASUK','Masuk'],['KELUAR','Keluar']].map(function(t){var x=r.filter(function(y){return !t[0]||y.arah===t[0]});var p=x.reduce(function(a,y){return a+qty(y)},0);return '<button data-a="'+t[0]+'" aria-pressed="'+(arah===t[0])+'">'+t[1]+'<b>'+x.length+'</b></button>'}).join('')}
function filt(abaiArah,abaiSumber){return DATA.filter(function(t){var d=t.dibuat.slice(0,10);if(($('#dari').value&&d<$('#dari').value)||($('#sampai').value&&d>$('#sampai').value))return false;var s=(t.nomor+t.list+t.input+t.baris.map(function(b){return b.sku}).join(' ')).toLowerCase();return (abaiArah||!arah||t.arah===arah)&&(abaiSumber||!sumberSel.length||sumberSel.indexOf(t.sumber)>-1)&&(!kw||s.indexOf(kw)>-1)})}
function daftar(){var r=filt(),h='',last='',i=0,o=0;
 r.forEach(function(t){var d=hari(t.dibuat);t.arah==='MASUK'?i+=qty(t):o+=qty(t);
  if(d!==last){var grup=r.filter(function(x){return hari(x.dibuat)===d}).length;h+='<div class="day"><span>'+d+'</span><span>'+grup+' transfer</span></div>';last=d}
  h+='<div class="card '+(t.arah==='MASUK'?'in':'out')+(sel===t.id?' sel':'')+'" data-id="'+t.id+'"><div class="r1"><span><span class="dot"></span><b class="mono">'+t.nomor+'</b>'+(t.log.length?'<span class="edited">diedit</span>':'')+'</span><span class="qty">'+(t.input?(t.arah==='MASUK'?'+':'−')+qty(t):'—')+'</span></div><div class="r2"><span>'+t.sumber+(t.ref?' · '+t.ref:'')+'</span><span>'+esc(t.input||'menunggu qty')+'</span></div></div>'});
 $('#list').innerHTML=h||'<div class="empty" style="padding:40px">Tidak ada transfer yang cocok</div>';
 seg()}
function ubah(b,o,f){return o&&o[f]!==b[f]}
function nilai(t,b,i,f,tipe){var o=t.baris[i];
 if(!edit)return '<span class="ed" data-start="'+f+'|'+i+'" title="Klik untuk edit">'+esc(b[f])+'</span>';
 return '<input '+(tipe==='n'?'class="q" type="number" min="1" ':'')+'data-f="'+f+'" data-i="'+i+'" value="'+esc(b[f])+'">'+(ubah(b,o,f)?'<span class="was">'+esc(o[f])+'</span>':'')}
function detail(){var t=cur();if(!t){$('#detail').innerHTML='<div class="empty">Pilih transfer di kiri<br>untuk melihat rincian dan mengeditnya.</div>';return}
 var masuk=t.arah==='MASUK',sg=masuk?1:-1,b=draft||t;
 var h='<div class="dhead"><div><b class="mono" style="font-size:20px">'+t.nomor+'</b> <span class="pill '+(masuk?'ok':'warn')+'">'+(masuk?'Masuk':'Keluar')+'</span><div class="muted">'+t.sumber+(t.ref?' · '+t.ref:'')+'</div></div><div>'+(edit?'':'<button class="btn pri" data-mode>✎ Edit transfer</button>')+'</div></div><div class="dbody">';
 h+='<div class="meta"><div><small>Petugas list</small>'+(edit?'<input data-h="list" value="'+esc(b.list)+'" style="width:100%">':esc(t.list||'—'))+'<small>'+(t.tglList?tgl(t.tglList):'')+'</small></div><div><small>Petugas input</small>'+(edit?'<input data-h="input" value="'+esc(b.input)+'" style="width:100%">':esc(t.input||'—'))+'<small>'+(t.tglInput?tgl(t.tglInput):'')+'</small></div><div><small>Total</small><b style="font-size:18px">'+(masuk?'+':'−')+qty(b)+' pcs</b><small>'+b.baris.length+' baris</small></div></div>';
 h+='<h3>Rincian per SKU dan rak</h3><table><thead><tr><th>SKU</th><th>No rak</th><th class="n">Qty</th><th class="n">Stok rak</th>'+(edit?'<th></th>':'')+'</tr></thead><tbody>';
 if(!b.baris.length)h+='<tr><td colspan="5" class="muted">Menunggu CS input qty dari slip.</td></tr>';
 b.baris.forEach(function(x,i){var o=t.baris[i];
  h+='<tr><td class="mono'+(ubah(x,o,'sku')?' chg':'')+'">'+nilai(t,x,i,'sku')+'</td><td class="mono'+(ubah(x,o,'rak')?' chg':'')+'">'+nilai(t,x,i,'rak')+'</td><td class="n'+(ubah(x,o,'qty')?' chg':'')+'"><b>'+(edit||true?'':'')+'</b>'+nilai(t,x,i,'qty','n')+'</td><td class="n muted">'+x.sb+' → <b style="color:var(--ink)">'+(x.sb+sg*x.qty)+'</b></td>'+(edit?'<td><button class="btn sm" data-del="'+i+'" title="Hapus baris">✕</button></td>':'')+'</tr>'});
 h+='</tbody></table>'+(edit?'<button class="btn sm" data-add style="margin-top:8px">+ Tambah baris</button>':'');
 h+='<h3 style="margin-top:22px">Riwayat</h3><ul class="tl-hist">'+t.log.map(function(l){return '<li class="e"><b>'+esc(l.t)+'</b><br><span class="muted">'+l.w+' · '+esc(l.o)+' · “'+esc(l.a)+'”</span></li>'}).join('')+'<li><b>Transfer dibuat</b><br><span class="muted">'+tgl(t.dibuat)+(t.input?' · '+esc(t.input):'')+'</span></li></ul></div>';
 if(edit){var n=ringkas();h+='<div class="save"><div style="min-width:170px"><b>'+n.length+' perubahan</b><br><span class="muted" style="font-size:12px">stok rak ikut bergeser</span></div><input id="alasan" placeholder="Alasan perubahan (wajib, min. 5 huruf)" value="'+esc(alasan)+'"><button class="btn" data-batal>Batal</button><button class="btn pri" data-simpan disabled>Simpan</button></div>'}
 $('#detail').innerHTML=h;if(edit)cek()}
function ringkas(){var t=cur(),d=[];if(!draft)return d;['list','input'].forEach(function(k){if(draft[k]!==t[k])d.push('Petugas '+k+': '+t[k]+' → '+draft[k])});
 draft.baris.forEach(function(x,i){var o=t.baris[i];if(!o)d.push('Baris baru '+x.sku);else['sku','rak','qty'].forEach(function(f){if(o[f]!==x[f])d.push(f.toUpperCase()+' '+o.sku+': '+o[f]+' → '+x[f])})});
 if(draft.baris.length<t.baris.length)d.push((t.baris.length-draft.baris.length)+' baris dihapus');return d}
function cek(){var b=$('[data-simpan]');if(b)b.disabled=!(ringkas().length&&alasan.trim().length>=5);var n=document.querySelector('.save b');if(n)n.textContent=ringkas().length+' perubahan'}
function mulai(){edit=true;draft=JSON.parse(JSON.stringify(cur()));alasan='';detail()}
function akhir(){edit=false;draft=null;alasan='';detail()}
document.addEventListener('click',function(e){var g=function(s){return e.target.closest(s)};
 if(g('[data-a]')){arah=g('[data-a]').dataset.a;window.onRange()}
